<!DOCTYPE html>
<html>
<head>
<script type="module">
  import * as bp from 'https://esm.sh/@spotify/basic-pitch';
  
  async function test() {
    try {
        console.log("Starting test...");
        const ctx = new OfflineAudioContext(1, 22050 * 2, 22050);
        const buffer = ctx.createBuffer(1, 22050 * 2, 22050);
        const data = buffer.getChannelData(0);
        for(let i=0; i<data.length; i++) data[i] = Math.sin(2 * Math.PI * 440 * i / 22050);
        
        console.log("Loading model...");
        const basicPitch = new bp.BasicPitch('https://unpkg.com/@spotify/basic-pitch@1.0.1/model/model.json');
        
        let frames = [];
        let onsets = [];
        
        console.log("Evaluating...");
        await basicPitch.evaluateModel(
            buffer,
            (f, o, c) => {
                frames.push(...f);
                onsets.push(...o);
            },
            (p) => console.log('progress', p)
        );
        
        console.log("Frames array size:", frames.length);
        const notes = bp.noteFramesToTime(frames, onsets);
        console.log("Notes result type:", Array.isArray(notes), notes.length);
        if (notes.length > 0) {
            console.log("Note 0 keys:", Object.keys(notes[0]));
            console.log("Note 0:", JSON.stringify(notes[0]));
        }
        document.body.innerHTML = "Success";
    } catch(e) {
        console.error("Error:", e);
        document.body.innerHTML = "Error";
    }
  }
  
  test();
</script>
</head>
<body>
  <h1>Test</h1>
</body>
</html>
